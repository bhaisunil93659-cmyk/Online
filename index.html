<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 400px;
      margin: 80px auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      border: none;
      border-radius: 7px;
      background: #1976d2;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .success {
      text-align: center;
      padding: 30px 10px;
    }

    .success h2 {
      color: #2e7d32;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- First Page -->
    <div class="page active" id="page1">
      <h2>Registration</h2>

      <input type="text" id="fullName" placeholder="Full Name">
      <input type="tel" id="mobile" placeholder="Mobile Number">

      <button onclick="nextPage(2)">Next</button>
    </div>

    <!-- Second Page -->
    <div class="page" id="page2">
      <h2>Personal Details</h2>

      <input type="date" id="dob">
      <input type="email" id="gmail" placeholder="Gmail ID">

      <button onclick="nextPage(3)">Next</button>
    </div>

    <!-- Last Page -->
    <div class="page" id="page3">
      <div class="success">
        <h2>Register Successful</h2>
        <p>Your registration has been completed successfully.</p>
      </div>
    </div>

  </div>

  <script>
    function nextPage(pageNumber) {
      document.querySelectorAll('.page').forEach(function(page) {
        page.classList.remove('active');
      });

      document.getElementById('page' + pageNumber).classList.add('active');
    }
  </script>

</body>
</html>
